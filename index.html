<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="于天行的个人网站：个人介绍、项目、随笔与探索。" />
    <title>于天行 · 关于我</title>
    <link rel="alternate" hreflang="zh-CN" href="https://skywalker.fish/?lang=zh" />
    <link rel="alternate" hreflang="en" href="https://skywalker.fish/?lang=en" />
    <link rel="icon" href="favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="style.css" />
    <script src="i18n.js"></script>
  </head>
  <body>
    <a class="skip-link" href="#main" data-i18n="skipToContent">跳到正文</a>
    <nav aria-label="主导航">
      <div class="nav-links">
        <a href="#/" class="brand" data-i18n="profile">关于我</a>
        <a href="#/projects" data-i18n="projects">项目</a>
        <a href="#/portfolio" data-i18n="portfolio">持仓</a>
        <a href="#/essays" data-i18n="essays">随笔</a>
        <a href="#/adventures" data-i18n="adventures">探索</a>
        <a href="#/contact" data-i18n="contact">联系我</a>
      </div>
      <div class="nav-right">
        <div class="language-switch" role="group" aria-label="选择语言">
          <button type="button" data-language="zh" lang="zh-CN" aria-label="切换到中文" aria-pressed="true">中文</button>
          <button type="button" data-language="en" lang="en" aria-label="Switch to English" aria-pressed="false">English</button>
        </div>
        <button id="btn-login" class="btn-text" data-i18n="login">登录</button>
        <button id="btn-signup" class="btn-outline" data-i18n="signup">注册</button>
        <div class="nav-user" id="nav-user" style="display:none">
          <span class="nav-nickname" id="nav-nickname"></span>
          <span class="nav-realname" id="nav-realname"></span>
          <button class="btn-text" onclick="logout()" data-i18n="logout">退出</button>
        </div>
      </div>
    </nav>
    <script>if (typeof applyLanguageChrome === "function") applyLanguageChrome();</script>
    <main id="main" tabindex="-1"></main>
    <div id="modal-overlay" class="overlay hidden">
      <div id="modal-box" class="modal-box"></div>
    </div>
    <script src="essay-catalog.js"></script>
    <script src="app.js"></script>
  </body>
</html>
